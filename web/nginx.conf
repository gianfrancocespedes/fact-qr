# Configuración de Nginx para servir el build estático del frontend.

server {
    # Se escucha en IPv4 e IPv6: Railway enruta el tráfico público por IPv4, pero sus
    # comprobaciones internas y la red privada usan IPv6.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresión de los recursos de texto. El bundle de JavaScript pasa de ~207 KB a ~65 KB,
    # lo que se nota especialmente en la primera carga con conexiones lentas.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    # Los recursos con hash en el nombre (index-CuoNUx8_.js) son inmutables por definición:
    # cualquier cambio genera un nombre distinto, así que pueden cachearse indefinidamente.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es quien referencia los assets con hash, y servir una
    # versión antigua dejaría al navegador pidiendo archivos que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Toda ruta desconocida devuelve index.html en lugar de 404. Es lo que necesita una SPA:
    # el enrutamiento ocurre en el cliente, y el servidor no conoce las rutas de la aplicación.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de salud propio del contenedor, para que la plataforma pueda comprobar que el
    # servidor está sirviendo sin descargar la aplicación entera.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }
}
